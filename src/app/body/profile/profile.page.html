<ion-content [fullscreen]="true" class="profile-page">

  <!-- Cabecera de perfil -->
  <div class="profile-header">
    <div class="profile-info">
      <h2>{{ usuario.nombre || 'Juan Carlos' }}</h2>
      <p>{{ (usuario.objetivo && usuario.objetivo.length > 0 ? usuario.objetivo[0] : 'Mantener peso') }}</p>
      <p>Cumpleaños: 27 Diciembre</p>
    </div>
    <div class="profile-picture">
      <img src="https://placehold.co/100x100/FFFFFF/333?text=JC" alt="Foto de perfil" />
    </div>
  </div>

  <!-- Formulario editable -->
  <ion-list class="profile-options" lines="none">

  <!-- Nombre completo -->
  <ion-item>
    <ion-icon name="person-outline" slot="start"></ion-icon>
    <ion-input
      label="Nombre completo"
      class="profile-input"
      [(ngModel)]="usuario.nombre"
      [readonly]="!editando"
      placeholder="Tu nombre">
    </ion-input>
  </ion-item>

  <!-- Peso -->
  <ion-item>
    <ion-icon name="barbell-outline" slot="start"></ion-icon>
    <ion-input
      label="Peso (kg)"
      class="profile-input"
      type="number"
      [(ngModel)]="usuario.peso"
      [readonly]="!editando"
      placeholder="Tu peso">
    </ion-input>
  </ion-item>

  <!-- Altura -->
  <ion-item>
    <ion-icon name="body-outline" slot="start"></ion-icon>
    <ion-input
      label="Altura (cm)"
      class="profile-input"
      type="number"
      [(ngModel)]="usuario.altura"
      [readonly]="!editando"
      placeholder="Tu altura">
    </ion-input>
  </ion-item>

  <!-- Edad -->
  <ion-item>
    <ion-icon name="calendar-outline" slot="start"></ion-icon>
    <ion-input
      label="Edad"
      class="profile-input"
      type="number"
      [(ngModel)]="usuario.edad"
      [readonly]="!editando"
      placeholder="Tu edad">
    </ion-input>
  </ion-item>

  <!-- Género -->
  <ion-item>
    <ion-icon name="transgender-outline" slot="start"></ion-icon>
    <ion-input
      label="Género"
      class="profile-input"
      [(ngModel)]="usuario.genero"
      [readonly]="!editando"
      placeholder="Tu género">
    </ion-input>
  </ion-item>

  <!-- Objetivo -->
  <ion-item>
    <ion-icon name="analytics-outline" slot="start"></ion-icon>
    <ion-input
      label="Objetivo"
      class="profile-input"
      [readonly]="true"
      [value]="usuario.objetivo && usuario.objetivo.length > 0 ? usuario.objetivo.join(', ') : 'No definido'">
    </ion-input>
  </ion-item>

</ion-list>

  <!-- Botones de acción -->
  <div class="action-buttons ion-padding">
    <ion-button expand="block" class="edit-button" *ngIf="!editando" (click)="habilitarEdicion()">
      Editar Perfil
    </ion-button>
    <ion-button expand="block" class="save-button" *ngIf="editando" (click)="guardarCambios()">
      Guardar Cambios
    </ion-button>
    <ion-button expand="block" color="danger" (click)="cerrarSesion()">
      Cerrar Sesión
    </ion-button>
  </div>

</ion-content>

<!-- Barra de tabs usando el componente reutilizable -->
<app-custom-tabs [activeTab]="'profile'"></app-custom-tabs>
