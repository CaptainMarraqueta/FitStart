<ion-header class="ion-no-border">
  <ion-toolbar>
    <ion-buttons slot="end">
      <ion-button>
        <ion-icon slot="icon-only" name="search-outline"></ion-icon>
      </ion-button>
      <ion-button>
        <ion-icon slot="icon-only" name="notifications-outline"></ion-icon>
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true" class="ion-padding">
  <!-- Header text -->
  <div class="header-section">
    <p>Es hora de desafiar tus límites.</p>
  </div>

  <!-- Vertical Menu -->
  <div class="vertical-menu">
    <div class="menu-item">
      <ion-icon name="barbell-outline"></ion-icon>
      <span>Ejercicios</span>
    </div>
    <div class="menu-item">
      <ion-icon name="trophy-outline"></ion-icon>
      <span>Desafíos</span>
    </div>
    <div class="menu-item">
      <ion-icon name="restaurant-outline"></ion-icon>
      <span>Recetas</span>
    </div>
    <div class="menu-item" (click)="goTo('profile')">
      <ion-icon name="person-outline"></ion-icon>
      <span>Perfil</span>
    </div>
  </div>

  <!-- Consejo del Día -->
  <ion-card class="tip-card">
    <ion-card-header>
      <ion-card-title>Consejo Del Día</ion-card-title>
    </ion-card-header>
    <ion-card-content>
      Como más frutas. Son ricas en fibra y te ayudarán a mantenerte saludable por más tiempo.
      <a href="#" class="view-more">Ver Más</a>
    </ion-card-content>
  </ion-card>

  <!-- Sección de Ejercicios -->
  <div class="section-header">
    <h2>Ejercicios</h2>
    <a href="#">Ver Más</a>
  </div>

  <div class="exercise-cards">
    <ion-card class="exercise-card trotar">
      <div class="card-content">
        <h3>Trotar</h3>
        <p>30 MINUTOS - 200 KCAL</p>
        <span>Trotar</span>
      </div>
    </ion-card>
    <ion-card class="exercise-card ciclismo">
      <div class="card-content">
        <h3>Ciclismo</h3>
        <p>1 HORA - 550 KCAL</p>
        <span>Andar en bici</span>
      </div>
    </ion-card>
  </div>
</ion-content>

<!-- Usamos el componente de pestañas que ya creamos -->
<app-custom-tabs [activeTab]="'progreso'"></app-custom-tabs>
