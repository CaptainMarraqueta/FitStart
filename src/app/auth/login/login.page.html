<ion-content>
  <div class="img">
    <img src="../../../assets/icon/riñon.png" alt="Descripción de la imagen" />
  </div>

  <ion-item class="list">
    <ion-input
      label="Email"
      labelPlacement="floating"
      type="email"
      placeholder="email@domain.com"
      [(ngModel)]="credenciales.email">
    </ion-input>
  </ion-item>

  <ion-item class="list">
    <ion-input
      label="Contraseña"
      type="password"
      labelPlacement="floating"
      [(ngModel)]="credenciales.password">
    </ion-input>
  </ion-item>

  <!-- Toggle para guardar credenciales con biometría -->
  <ion-item *ngIf="biometricAvailable">
    <ion-label>Guardar credenciales y usar biometría</ion-label>
    <ion-toggle [(ngModel)]="useBiometric"></ion-toggle>
  </ion-item>

  <div class="boton-container">
    <ion-button class="boton" expand="block" (click)="iniciarSesion()">
      Iniciar sesión
    </ion-button>
  <div style="text-align: center; margin-top: 10px;">
    <ion-button expand="block" fill="clear" (click)="irAforgotpas()">¿Olvidaste tu contraseña?</ion-button>
  </div>
    <!-- Botón para login manual con biometría (opcional) -->
    <ion-button
      expand="block"
      color="secondary"
      *ngIf="biometricAvailable"
      (click)="loginConBiometria()">
      Entrar con biometría
    </ion-button>

    <ion-button expand="block" fill="clear" (click)="irARegistro()">
      ¿No tienes cuenta? Regístrate aquí
    </ion-button>
  </div>
</ion-content>
